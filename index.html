    <style>
        :root {
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Vazirmatn', sans-serif !important;
            color: #ffffff;
            min-height: 100vh;
            background-color: #03050a;
            
            /* تصویر پس‌زمینه معماری مدرن تاریک (بسیار لوکس) */
            background-image: url('https://images.unsplash.com/photo-1600607686527-6fb886090705?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* لایه پوششی تیره برای تمرکز روی کارت */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.08) 0%, rgba(3, 5, 10, 0.95) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* بافت نویز (Grain Texture) - راز طراحی‌های لوکس ۲۰۲۴ */
        .noise-texture {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* مخفی کردن اسکرول‌بار */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* کارت شیشه‌ای پریمیوم (Ultra Premium Glassmorphism) */
        .glass-panel-dark {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(5, 9, 20, 0.95) 100%);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top-color: rgba(255, 255, 255, 0.3);
            border-left-color: rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.9), 
                0 0 40px rgba(0, 210, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* دکمه‌های ارتباطی با درخشش ملایم */
        .glass-button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            transform: skewX(-20deg);
            transition: 0.6s;
        }

        .glass-button:hover {
            border-color: var(--glass-highlight);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        
        .glass-button:hover::before {
            left: 150%;
        }

        /* انیمیشن ورود ظریف */
        .fade-in-up {
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* استایل اسکرول روان برای گالری */
        .portfolio-img {
            scroll-snap-align: center;
        }
    </style>
</head>

    </main>

    <script>
        /**
         * 1. سیستم لود تنبل (Lazy Load) برای گالری نمونه‌کارها
         * عملکرد: بارگذاری فوق سریع اولیه + لود عکس‌ها از پوشه portfolio
         */
        const sliderContainer = document.getElementById('portfolio-slider');
        const maxImages = 60; 
        
        // استفاده از DocumentFragment برای افزایش سرعت رندر DOM
        const fragment = document.createDocumentFragment();

        for (let i = 1; i <= maxImages; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = "portfolio-img shrink-0 w-[110px] h-[150px] sm:w-[120px] sm:h-[160px] rounded-2xl overflow-hidden bg-white/5 relative group cursor-pointer border border-white/5 hover:border-brand-accent/50 transition-all duration-300 shadow-lg";
            
            const img = document.createElement('img');
            // لود تنبل و بهینه‌سازی
            img.setAttribute('loading', 'lazy');
            img.setAttribute('decoding', 'async');
            img.src = `./portfolio/${i}.jpg`;
            img.alt = `نمونه کار ${i}`;
            img.className = "w-full h-full object-cover opacity-70 group-hover:opacity-100 group-hover:scale-110 transition-all duration-700";
            
            // در صورت نبود عکس در پوشه، تگ پاک می‌شود تا جای خالی نماند
            img.onerror = function() {
                this.parentElement.remove();
            };

            const overlay = document.createElement('div');
            overlay.className = "absolute inset-0 bg-brand-dark/40 group-hover:bg-transparent transition-colors duration-300 pointer-events-none";

            wrapper.appendChild(img);
            wrapper.appendChild(overlay);
            fragment.appendChild(wrapper);
        }
        
        sliderContainer.appendChild(fragment);

        /**
         * 2. سیستم انیمیشن ذرات معلق (Optimized Canvas)
         */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d', { alpha: true }); // بهینه‌سازی کانتکست
        
        let width, height;
        let particles = [];
        
        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.2 - 0.1;
                this.speedY = Math.random() * 0.2 - 0.1;
                // رنگ فیروزه‌ای کم‌رنگ هماهنگ با تم
                this.color = `rgba(0, 210, 255, ${Math.random() * 0.3 + 0.1})`; 
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x > width) this.x = 0;
                else if (this.x < 0) this.x = width;
                
                if (this.y > height) this.y = 0;
                else if (this.y < 0) this.y = height;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            // تعداد ذرات کمتر برای موبایل جهت سرعت بیشتر
            let particleCount = window.innerWidth < 600 ? 25 : 60; 
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // مقداردهی اولیه پس از بارگذاری کامل ساختار
        window.addEventListener('DOMContentLoaded', () => {
            initCanvas();
            initParticles();
            requestAnimationFrame(animate);
        });

        // ریسایز بهینه
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                initCanvas();
                initParticles();
            }, 200);
        });
    </script>
